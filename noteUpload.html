<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手记上传</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>📝 手记上传</h1>
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <div class="panel">
        <!-- 双模式切换 -->
        <div class="config-toggle-area">
            <label>
                <input type="checkbox" id="useIndependentConfig"> 使用本页独立配置 (取消则使用全局)
            </label>
            <div class="independent-config" id="independentConfigArea">
                <div class="form-group">
                    <label>Token</label>
                    <input type="password" id="localToken" placeholder="独立令牌">
                </div>
                <div class="form-group">
                    <label>Owner</label>
                    <input type="text" id="localOwner" placeholder="独立所有者">
                </div>
                <div class="form-group">
                    <label>Repo</label>
                    <input type="text" id="localRepo" placeholder="独立仓库">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>云端文件路径 (如: notes/daily.md)</label>
            <input type="text" id="filePath" placeholder="例如: notes/20260830.md">
        </div>
        <div class="form-group">
            <label>Markdown 内容</label>
            <textarea id="markdownContent" placeholder="今天做了什么..."></textarea>
        </div>

        <button class="btn" id="uploadBtn">🚀 提交上传</button>
        <div id="uploadMsg" style="margin-top: 1rem;"></div>
    </div>

    <div class="footer"><p>© 2026 个人静态工具集</p></div>
</div>

<script src="js/giteeApi.js"></script>
<script src="js/configHelper.js"></script>
<script src="js/noteUpload.js"></script>
</body>
</html>
