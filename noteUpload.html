<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手记上传工具</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            max-width: 900px;
            margin: 20px auto;
            padding: 0 16px;
        }
        .item {
            margin: 12px 0;
        }
        label {
            display: block;
            margin-bottom: 4px;
            font-weight: 500;
        }
        input,
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }
        textarea {
            min-height: 280px;
            white-space: pre-wrap;
        }
        button {
            padding: 10px 18px;
            background: #c7000b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        button:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        .result {
            margin-top: 16px;
            padding: 12px;
            background: #f4f4f4;
            border-radius: 6px;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .back-wrap{
            margin-top:30px;
            text-align:center;
        }
        .back-home{
            color:#2563eb;
            text-decoration:none;
        }
    </style>
</head>

<body>
<h2>Markdown手记上传</h2>

<div class="item">
    <label>
        <input type="checkbox" id="useGlobalCfg" checked>
        使用全局配置（取消为本页独立仓库/token）
    </label>
</div>
<div class="item">
    <label>仓库(用户名/仓库名)</label>
    <input id="repoFull" placeholder="lishijie-me/100‑days2026" />
</div>
<div class="item">
    <label>分支（一般main）</label>
    <input id="branch" placeholder="main" value="main"/>
</div>
<div class="item">
    <label>文件路径（可修改）</label>
    <input id="filePath" placeholder="例如 20260822-手记.md" />
</div>
<div class="item">
    <label>私人令牌 access_token</label>
    <input id="token" type="password" placeholder="你的gitee私人令牌" />
</div>
<div class="item">
    <label>手记Markdown内容</label>
    <textarea id="mdContent" placeholder="在这里粘贴你的每日手记markdown……"></textarea>
</div>

<div class="item">
    <button id="uploadBtn">提交上传（同名文件自动覆盖）</button>
</div>

<div class="result" id="result"></div>

<div class="back-wrap">
    <a class="back-home" href="./index.html">← 返回工具导航首页</a>
</div>

<script src="./giteeApiUtils.js"></script>
<script>
    const PAGE_LOCAL_KEY = "note_upload_local_config";
    const PAGE_USE_GLOBAL_KEY = "note_upload_use_global";

    const useGlobalCfgCb = document.getElementById("useGlobalCfg");
    const repoFullInput = document.getElementById("repoFull");
    const branchInput = document.getElementById("branch");
    const filePathInput = document.getElementById("filePath");
    const tokenInput = document.getElementById("token");
    const mdContentInput = document.getElementById("mdContent");
    const uploadBtn = document.getElementById("uploadBtn");
    const resultEl = document.getElementById("result");

    function getPageUseGlobal(){
        const s = localStorage.getItem(PAGE_USE_GLOBAL_KEY);
        return s === null ? true : (s === "true");
    }
    function savePageUseGlobal(flag){
        localStorage.setItem(PAGE_USE_GLOBAL_KEY, String(flag));
    }

    function fillFormBySwitch(){
        const useGlobal = getPageUseGlobal();
        useGlobalCfgCb.checked = useGlobal;
        let cfg;
        if(useGlobal){
            cfg = getGiteeGlobalConfig();
        }else{
            cfg = getPageLocalConfig(PAGE_LOCAL_KEY);
        }
        repoFullInput.value = cfg.repo || "";
        tokenInput.value = cfg.token || "";
        branchInput.value = cfg.branch || "main";
    }

    function getCurrentCfg(){
        if(getPageUseGlobal()){
            return getGiteeGlobalConfig();
        }else{
            return getPageLocalConfig(PAGE_LOCAL_KEY);
        }
    }

    function saveCurrentCfgFromInput(){
        const cfg = {
            repo: repoFullInput.value.trim(),
            token: tokenInput.value.trim(),
            branch: branchInput.value.trim() || "main"
        };
        if(getPageUseGlobal()){
            saveGiteeGlobalConfig(cfg);
        }else{
            savePageLocalConfig(PAGE_LOCAL_KEY, cfg);
        }
    }

    // 日志封装，复用appendLog，直接输出到resultEl
    function logMsg(msg){
        appendLog(resultEl, msg);
    }

    window.onload = function(){
        fillFormBySwitch();
    };

    useGlobalCfgCb.onchange = function(){
        savePageUseGlobal(useGlobalCfgCb.checked);
        fillFormBySwitch();
    };

    uploadBtn.onclick = async function(){
        saveCurrentCfgFromInput();
        const cfg = getCurrentCfg();
        const filePath = filePathInput.value.trim();
        const mdText = mdContentInput.value;
        if(!filePath){
            logMsg("❌请填写文件路径");
            return;
        }
        if(!mdText){
            logMsg("❌手记内容不能为空");
            return;
        }
        setButtonsDisabled([uploadBtn], true);
        // 读取旧sha
        const getRet = await giteeGetFile(cfg, filePath, resultEl);
        let sha = null;
        if(getRet.ok && getRet.sha){
            sha = getRet.sha;
        }
        const base64 = btoa(unescape(encodeURIComponent(mdText)));
        const saveRet = await giteeSaveFile(cfg, filePath, base64, sha, "upload note", resultEl);
        if(saveRet.ok){
            logMsg("✅上传完成");
        }
        setButtonsDisabled([uploadBtn], false);
    }
</script>
</body>
</html>
