<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>随手歌单</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="page-header">
        <h1>🎵 随手歌单</h1>
        <a href="index.html" class="back-link">← 返回首页</a>
    </div>

    <div class="panel">
        <div class="config-toggle-area">
            <label>
                <input type="checkbox" id="useIndependentConfig"> 使用本页独立配置
            </label>
            <div class="independent-config" id="independentConfigArea">
                <div class="form-group"><label>Token</label><input type="password" id="localToken"></div>
                <div class="form-group"><label>Owner</label><input type="text" id="localOwner"></div>
                <div class="form-group"><label>Repo</label><input type="text" id="localRepo"></div>
            </div>
        </div>

        <p style="color: #6b7280; margin-bottom: 1rem;">📂 固定存储路径: <code>songlist.md</code></p>

        <div style="display: flex; gap: 0.5rem; margin-bottom: 1rem;">
            <input type="text" id="songInput" placeholder="输入歌曲名称 + 歌手" style="flex:1; padding:0.6rem; border:1px solid #d1d5db; border-radius:8px;">
            <button class="btn" id="addSongBtn">➕ 添加</button>
        </div>

        <button class="btn btn-outline" id="refreshListBtn" style="margin-bottom:1rem;">🔄 刷新列表</button>

        <div id="songListContainer">
            <!-- 动态渲染列表 -->
        </div>
        <div id="songMsg" style="margin-top: 1rem;"></div>
    </div>
    <div class="footer"><p>© 2026 个人静态工具集</p></div>
</div>

<script src="js/giteeApi.js"></script>
<script src="js/configHelper.js"></script>
<script src="js/songList.js"></script>
</body>
</html>
