<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gitee云端待办</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg,#e8edf7 0%,#f5f7fa 100%);
            min-height:100vh;
            padding:40px 20px;
        }
        .wrap {
            max-width:600px;
            margin:0 auto;
        }
        h1 {
            text-align:center;
            margin-bottom:20px;
            color:#1f2937;
            font-size:26px;
        }
        .config-area{
            background:#fff;
            padding:16px;
            border-radius:12px;
            margin-bottom:24px;
        }
        .config-area input{
            width:100%;
            padding:10px;
            margin:6px 0;
            border:1px solid #d1d5db;
            border-radius:8px;
        }
        .checkbox-row{
            margin-bottom:10px;
        }
        .input-area {
            display:flex;
            gap:10px;
            margin-bottom:24px;
        }
        #todoInput {
            flex:1;
            padding:12px 16px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:16px;
        }
        #addBtn,#saveConfig{
            padding:12px 20px;
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
        button:disabled{
            background:#94a3b8;
            cursor:not-allowed;
        }
        .todo-item {
            background:#fff;
            padding:16px 18px;
            border-radius:12px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
        }
        .todo-item.done .text{
            text-decoration: line-through;
            color:#9ca3af;
        }
        .text {
            flex:1;
            font-size:16px;
        }
        .del {
            color:#ef4444;
            cursor:pointer;
        }
        .back-home{
            margin-top:40px;
            text-align:center;
        }
        .back-home a{
            color:#2563eb;
            text-decoration:none;
        }
        .tip{
            color:#6b7280;
            font-size:13px;
            margin-bottom:12px;
        }
        .log{
            background:#eeeeee;
            padding:12px;
            font-size:12px;
            margin:12px 0;
            border-radius:8px;
            white-space:pre-wrap;
            max-height:220px;
            overflow:auto;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>☁️ Gitee云端待办</h1>
    <div class="tip">数据读写Gitee仓库todo.md，必须线上Pages域名访问</div>

    <div class="config-area">
        <div class="checkbox-row">
            <label>
                <input type="checkbox" id="useGlobalCfg" checked>
                使用全局Gitee配置（取消为本页独立仓库/token）
            </label>
        </div>
        <div>Gitee Token：</div>
        <input id="tokenInput" placeholder="gitee私人token">
        <div>仓库(用户名/仓库名)：</div>
        <input id="repoInput" placeholder="例如 abc/100‑days2026">
        <div>分支：</div>
        <input id="branchInput" placeholder="main" value="main">
        <button id="saveConfig">保存配置并加载待办</button>
    </div>

    <div class="input-area">
        <input id="todoInput" placeholder="新增待办事项...">
        <button id="addBtn">新增</button>
    </div>
    <div id="todoList"></div>
    <div id="logBox" class="log"></div>

    <div class="back-home">
        <a href="./index.html">← 返回工具首页</a>
    </div>
</div>

<script src="./giteeApiUtils.js"></script>
<script>
    const PAGE_LOCAL_KEY = "todo_local_config";
    const PAGE_USE_GLOBAL_KEY = "todo_use_global";
    const REMOTE_FILE = "todo.md";

    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");
    const tokenInput = document.getElementById("tokenInput");
    const repoInput = document.getElementById("repoInput");
    const branchInput = document.getElementById("branchInput");
    const saveConfigBtn = document.getElementById("saveConfig");
    const logBox = document.getElementById("logBox");
    const useGlobalCfgCb = document.getElementById("useGlobalCfg");

    let fileSha = null;

    // ----页面开关存储逻辑----
    function getPageUseGlobal(){
        const s = localStorage.getItem(PAGE_USE_GLOBAL_KEY);
        return s === null ? true : (s === "true");
    }
    function savePageUseGlobal(flag){
        localStorage.setItem(PAGE_USE_GLOBAL_KEY, String(flag));
    }

    function fillFormBySwitch(){
        const useGlobal = getPageUseGlobal();
        useGlobalCfgCb.checked = useGlobal;
        let cfg;
        if(useGlobal){
            cfg = getGiteeGlobalConfig();
        }else{
            cfg = getPageLocalConfig(PAGE_LOCAL_KEY);
        }
        repoInput.value = cfg.repo || "";
        tokenInput.value = cfg.token || "";
        branchInput.value = cfg.branch || "main";
    }

    function getCurrentCfg(){
        if(getPageUseGlobal()){
            return getGiteeGlobalConfig();
        }else{
            return getPageLocalConfig(PAGE_LOCAL_KEY);
        }
    }

    function saveCurrentCfgFromInput(){
        const cfg = {
            repo: repoInput.value.trim(),
            token: tokenInput.value.trim(),
            branch: branchInput.value.trim() || "main"
        };
        if(getPageUseGlobal()){
            saveGiteeGlobalConfig(cfg);
        }else{
            savePageLocalConfig(PAGE_LOCAL_KEY, cfg);
        }
        appendLog(logBox,"✅配置已保存");
    }

    //业务：解析markdown待办
    function parseMarkdownTodo(mdText){
        const lines = mdText.split("\n");
        const list = [];
        for(let line of lines){
            const match = line.match(/^-\s*\[([ xX])\]\s*(.+)$/);
            if(match){
                list.push({
                    done: match[1].toLowerCase() === "x",
                    content: match[2].trim()
                })
            }
        }
        return list;
    }

    function buildMarkdown(list){
        return list.map(item=>`- [${item.done?"x":" "}] ${item.content}`).join("\n");
    }

    function escapeHtml(str){
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    function renderTodo(list){
        todoList.innerHTML = "";
        list.forEach((item,idx)=>{
            const div = document.createElement("div");
            div.className = "todo-item" + (item.done?" done":"");
            div.innerHTML = `
            <input type="checkbox" ${item.done?"checked":""} data-index="${idx}">
            <div class="text">${escapeHtml(item.content)}</div>
            <span class="del" data-index="${idx}">删除</span>
        `;
            todoList.appendChild(div);
        })
    }

    //读取远程todo.md
    async function fetchTodoMd(){
        const cfg = getCurrentCfg();
        const ret = await giteeGetFile(cfg, REMOTE_FILE, logBox);
        if(!ret.ok){
            renderTodo([]);
            return [];
        }
        fileSha = ret.sha;
        if(ret.sha === null || !ret.content){
            appendLog(logBox,"ℹ️todo.md不存在或为空");
            renderTodo([]);
            return [];
        }
        const rawMd = decodeURIComponent(escape(atob(ret.content.replace(/\s/g,""))));
        const list = parseMarkdownTodo(rawMd);
        renderTodo(list);
        appendLog(logBox,"✅待办读取完成");
        return list;
    }

    //保存到远程
    async function saveTodoList(list){
        const cfg = getCurrentCfg();
        //保存前刷新sha
        await fetchTodoMd();
        const mdText = buildMarkdown(list);
        const base64Str = btoa(unescape(encodeURIComponent(mdText)));
        const ret = await giteeSaveFile(cfg, REMOTE_FILE, base64Str, fileSha, "更新待办", logBox);
        if(ret.ok){
            fileSha = ret.newSha;
        }
        return ret.ok;
    }

    //事件
    saveConfigBtn.onclick = async ()=>{
        saveCurrentCfgFromInput();
        setButtonsDisabled([saveConfigBtn,addBtn],true);
        await fetchTodoMd();
        setButtonsDisabled([saveConfigBtn,addBtn],false);
    };

    addBtn.onclick = async ()=>{
        const val = todoInput.value.trim();
        if(!val){
            appendLog(logBox,"待办内容不能为空");
            return;
        }
        setButtonsDisabled([saveConfigBtn,addBtn],true);
        const list = await fetchTodoMd();
        list.push({done:false, content:val});
        const ok = await saveTodoList(list);
        if(ok){
            todoInput.value = "";
            renderTodo(list);
        }
        setButtonsDisabled([saveConfigBtn,addBtn],false);
    };

    todoInput.onkeydown = async e=>{
        if(e.key === "Enter") await addBtn.click();
    };

    todoList.onclick = async e=>{
        const idx = Number(e.target.dataset.index);
        if(isNaN(idx)) return;
        setButtonsDisabled([saveConfigBtn,addBtn],true);
        const list = await fetchTodoMd();
        if(e.target.type === "checkbox"){
            list[idx].done = e.target.checked;
        }else if(e.target.classList.contains("del")){
            list.splice(idx,1);
        }
        const ok = await saveTodoList(list);
        if(ok) renderTodo(list);
        setButtonsDisabled([saveConfigBtn,addBtn],false);
    };

    useGlobalCfgCb.onchange = ()=>{
        savePageUseGlobal(useGlobalCfgCb.checked);
        fillFormBySwitch();
    };

    window.onload = ()=>{
        fillFormBySwitch();
    };
</script>
</body>
</html>
