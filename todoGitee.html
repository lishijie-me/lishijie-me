<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gitee云端待办</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(135deg,#e8edf7 0%,#f5f7fa 100%);
            min-height:100vh;
            padding:40px 20px;
        }
        .wrap {
            max-width:600px;
            margin:0 auto;
        }
        h1 {
            text-align:center;
            margin-bottom:20px;
            color:#1f2937;
            font-size:26px;
        }
        .config-area{
            background:#fff;
            padding:16px;
            border-radius:12px;
            margin-bottom:24px;
        }
        .config-area input{
            width:100%;
            padding:10px;
            margin:6px 0;
            border:1px solid #d1d5db;
            border-radius:8px;
        }
        .input-area {
            display:flex;
            gap:10px;
            margin-bottom:24px;
        }
        #todoInput {
            flex:1;
            padding:12px 16px;
            border:1px solid #d1d5db;
            border-radius:10px;
            font-size:16px;
        }
        #addBtn,#saveConfig{
            padding:12px 20px;
            background:#2563eb;
            color:#fff;
            border:none;
            border-radius:10px;
            cursor:pointer;
        }
        .todo-item {
            background:#fff;
            padding:16px 18px;
            border-radius:12px;
            margin-bottom:12px;
            display:flex;
            align-items:center;
            gap:12px;
            box-shadow:0 2px 8px rgba(0,0,0,0.06);
        }
        .todo-item.done .text{
            text-decoration: line-through;
            color:#9ca3af;
        }
        .text {
            flex:1;
            font-size:16px;
        }
        .del {
            color:#ef4444;
            cursor:pointer;
        }
        .back-home{
            margin-top:40px;
            text-align:center;
        }
        .back-home a{
            color:#2563eb;
            text-decoration:none;
        }
        .tip{
            color:#6b7280;
            font-size:13px;
            margin-bottom:12px;
        }
        .log{
            background:#eeeeee;
            padding:12px;
            font-size:12px;
            margin:12px 0;
            border-radius:8px;
            white-space:pre-wrap;
            max-height:220px;
            overflow:auto;
        }
    </style>
</head>
<body>
<div class="wrap">
    <h1>☁️ Gitee云端待办</h1>
    <div class="tip">数据读写Gitee仓库todo.md，必须线上Pages域名访问</div>

    <div class="config-area">
        <div>Gitee Token：</div>
        <input id="tokenInput" placeholder="gitee私人token">
        <div>仓库(用户名/仓库名)：</div>
        <input id="repoInput" placeholder="例如 abc/100‑days2026">
        <button id="saveConfig">保存配置并加载待办</button>
    </div>

    <div class="input-area">
        <input id="todoInput" placeholder="新增待办事项...">
        <button id="addBtn">新增</button>
    </div>
    <div id="todoList"></div>
    <div id="logBox" class="log"></div>

    <div class="back-home">
        <a href="./index.html">← 返回工具首页</a>
    </div>
</div>

<script>
    const STORAGE_KEY = "gitee_todo_config";
    const DEFAULT_REPO = "lishijie-me/100-days2026"; // 修改这里为你的仓库
    const todoInput = document.getElementById("todoInput");
    const addBtn = document.getElementById("addBtn");
    const todoList = document.getElementById("todoList");
    const tokenInput = document.getElementById("tokenInput");
    const repoInput = document.getElementById("repoInput");
    const saveConfigBtn = document.getElementById("saveConfig");
    const logBox = document.getElementById("logBox");

    let config = {token:"", repo:""};
    let fileSha = null;

    function log(msg){
        logBox.innerText += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
        logBox.scrollTop = logBox.scrollHeight;
    }

    // UTF‑8 Base64编解码
    function toBase64(str){
        return btoa(unescape(encodeURIComponent(str)));
    }
    function fromBase64(b64){
        return decodeURIComponent(escape(atob(b64)));
    }

    function loadConfig(){
        const str = localStorage.getItem(STORAGE_KEY);
        if(str){
            config = JSON.parse(str);
            tokenInput.value = config.token;
            repoInput.value = config.repo;
            log("✅ 已加载本地配置");
        }else{
            repoInput.value = DEFAULT_REPO;
            config.repo = DEFAULT_REPO;
            log("ℹ️ 使用默认仓库配置");
        }
    }
    function saveConfigLocal(){
        config.token = tokenInput.value.trim();
        config.repo = repoInput.value.trim();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(config));
        log("✅ 配置已保存");
    }

    //读取文件，强制刷新sha
    async function fetchTodoMd(){
        if(!config.token || !config.repo){
            alert("请填写token信息");
            return;
        }
        log("🔍 请求读取todo.md");
        try{
            const url = `https://gitee.com/api/v5/repos/${config.repo}/contents/todo.md?access_token=${config.token}`;
            const resp = await fetch(url);
            if(resp.status === 404){
                log("ℹ️ todo.md不存在");
                fileSha = null;
                renderTodo([]);
                return;
            }
            if(!resp.ok){
                const errJson = await resp.json();
                log(`❌读取失败 HTTP${resp.status}：${JSON.stringify(errJson)}`);
                return;
            }
            const json = await resp.json();
            fileSha = json.sha;
            log(`✅读取成功，sha=${fileSha}`);
            const raw = fromBase64(json.content);
            const list = parseMarkdownTodo(raw);
            renderTodo(list);
        }catch(e){
            log(`❌网络异常：${e.message}`);
        }
    }

    function parseMarkdownTodo(mdText){
        const lines = mdText.split("\n");
        const list = [];
        for(let line of lines){
            const match = line.match(/^-\s*\[([ xX])\]\s*(.+)$/);
            if(match){
                list.push({
                    done: match[1].toLowerCase() === "x",
                    content: match[2].trim()
                })
            }
        }
        return list;
    }

    function buildMarkdown(list){
        return list.map(item=>`- [${item.done?"x":" "}] ${item.content}`).join("\n");
    }

    async function saveToGitee(list){
        if(!config.token || !config.repo) return false;
        //保存前重新拉取最新sha，解决sha过期问题
        await fetchTodoMd();
        const mdContent = buildMarkdown(list);
        log(`📝准备提交内容:\n${mdContent}`);
        const payload = {
            access_token: config.token,
            message: "更新待办",
            content: toBase64(mdContent)
        };
        if(fileSha) payload.sha = fileSha;
        log(`📤携带sha:${fileSha??"null"}`);
        const resp = await fetch(`https://gitee.com/api/v5/repos/${config.repo}/contents/todo.md`,{
            method:"PUT",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify(payload)
        });
        const resJson = await resp.json();
        if(!resp.ok){
            log(`❌保存失败:${JSON.stringify(resJson)}`);
            return false;
        }
        fileSha = resJson.content.sha;
        log(`🎉提交成功，新sha=${fileSha}`);
        return true;
    }

    function renderTodo(list){
        todoList.innerHTML = "";
        list.forEach((item,idx)=>{
            const div = document.createElement("div");
            div.className = "todo-item" + (item.done?" done":"");
            div.innerHTML = `
            <input type="checkbox" ${item.done?"checked":""} data-index="${idx}">
            <div class="text">${escapeHtml(item.content)}</div>
            <span class="del" data-index="${idx}">删除</span>
        `;
            todoList.appendChild(div);
        })
    }
    function escapeHtml(str){
        return str.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    saveConfigBtn.onclick = async ()=>{
        saveConfigLocal();
        await fetchTodoMd();
    }

    addBtn.onclick = async ()=>{
        const val = todoInput.value.trim();
        if(!val) return;
        const list = await getCurrentList();
        list.push({done:false, content:val});
        const ok = await saveToGitee(list);
        if(ok){
            todoInput.value = "";
            renderTodo(list);
        }
    }
    todoInput.onkeydown = async e=>{
        if(e.key === "Enter") await addBtn.click();
    }

    async function getCurrentList(){
        if(!config.token||!config.repo) return [];
        const resp = await fetch(`https://gitee.com/api/v5/repos/${config.repo}/contents/todo.md?access_token=${config.token}`);
        if(resp.status ===404) return [];
        const json = await resp.json();
        fileSha = json.sha;
        return parseMarkdownTodo(fromBase64(json.content));
    }

    todoList.onclick = async e=>{
        const idx = Number(e.target.dataset.index);
        if(isNaN(idx)) return;
        const list = await getCurrentList();
        if(e.target.type === "checkbox"){
            list[idx].done = e.target.checked;
        }else if(e.target.classList.contains("del")){
            list.splice(idx,1);
        }
        const ok = await saveToGitee(list);
        if(ok) renderTodo(list);
    }

    loadConfig();
</script>
</body>
</html>
